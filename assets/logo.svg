<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Outer hex = "infra" -->
  <polygon points="256,66 413,161 413,351 256,446 99,351 99,161"
           fill="none"
           stroke="url(#hexGrad)"
           stroke-width="14"
           stroke-linejoin="round"/>

  <!-- Graph edges: center node -> each hex vertex ("nodes/topology") -->
  <g stroke="url(#hexGrad)" stroke-width="4" opacity="0.55">
    <line x1="256" y1="256" x2="256" y2="66"/>
    <line x1="256" y1="256" x2="413" y2="161"/>
    <line x1="256" y1="256" x2="413" y2="351"/>
    <line x1="256" y1="256" x2="256" y2="446"/>
    <line x1="256" y1="256" x2="99"  y2="351"/>
    <line x1="256" y1="256" x2="99"  y2="161"/>
  </g>

  <!-- Node dots at each vertex ("infra resources") -->
  <g fill="#F8FAFC" stroke="url(#hexGrad)" stroke-width="4">
    <circle cx="256" cy="66"  r="10"/>
    <circle cx="413" cy="161" r="10"/>
    <circle cx="413" cy="351" r="10"/>
    <circle cx="256" cy="446" r="10"/>
    <circle cx="99"  cy="351" r="10"/>
    <circle cx="99"  cy="161" r="10"/>
  </g>

  <!-- Center chip = "the contract" (dev/tool motif) -->
  <rect x="176" y="176" width="160" height="160" rx="24" fill="url(#chipGrad)"/>

  <!-- Symmetrical code brackets -->
  <g fill="none"
    stroke="#94A3B8"
    stroke-width="10"
    stroke-linecap="round"
    stroke-linejoin="round">

    <!-- Left { -->
    <path d="M220 205
            C205 205 198 214 198 228
            V246
            C198 256 194 256 186 256
            C194 256 198 256 198 266
            V284
            C198 298 205 307 220 307" />

    <!-- Right } -->
    <path d="M292 205
            C307 205 314 214 314 228
            V246
            C314 256 318 256 326 256
            C318 256 314 256 314 266
            V284
            C314 298 307 307 292 307" />
  </g>
  <!-- Checkmark = "contract enforced" -->
  <circle cx="256" cy="256" r="34" fill="#22C55E"/>
  <path d="M238 256 L250 268 L276 240"
        fill="none" stroke="#F8FAFC" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>

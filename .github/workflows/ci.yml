name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Format check (ruff)
        run: uv run ruff format --check src tests

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest -v

  build:
    name: build package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Build sdist + wheel
        run: uv build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  dogfood:
    name: self-check (infra-contract validates its own example)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install infra-contract from source
        run: pip install .
      - name: Validate example contract loads and passes on clean infra
        run: |
          infra-contract check \
            --contract examples/rag-app/infra-contract.yaml \
            examples/rag-app
      - name: Confirm violations are correctly detected (expected failure)
        run: |
          set +e
          infra-contract check \
            --contract examples/rag-app/infra-contract.yaml \
            --plan tests/fixtures/sample_plan.json \
            --format json > result.json
          code=$?
          cat result.json
          if [ "$code" -ne 1 ]; then
            echo "Expected infra-contract to detect violations and exit 1, got $code"
            exit 1
          fi
          echo "OK: violations correctly detected and blocked."

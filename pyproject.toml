[project]
name = "infra-contract"
version = "0.1.2"
description = "Infrastructure contracts for humans and AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "mcp>=1.2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.4",
    "isort>=5.13",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
]

[project.scripts]
infra-contract = "cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/ai",
    "src/cli",
    "src/contracts",
    "src/engine",
    "src/ir",
    "src/mcp",
    "src/policies",
    "src/providers",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ai", "cli", "contracts", "engine", "ir", "mcp", "policies", "providers"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
explicit_package_bases = true
files = ["src/ai", "src/cli", "src/contracts", "src/engine", "src/ir", "src/mcp", "src/policies", "src/providers"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
